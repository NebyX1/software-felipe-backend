# Institutional deployment: external MariaDB, MinIO and optional Redis.
services:
  backend:
    build: .
    environment:
      SERVICE_URL_BACKEND: /
      FLASK_APP: app
      FLASK_CONFIG: production
      TZ: America/Montevideo
      DATABASE_URL: ${DATABASE_URL:?Configure DATABASE_URL con mariadb+mariadbconnector}
      SECRET_KEY: ${SECRET_KEY:?Configure SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-${SECRET_KEY}}
      DB_POOL_RECYCLE: ${DB_POOL_RECYCLE:-1800}
      DB_POOL_TIMEOUT: ${DB_POOL_TIMEOUT:-30}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      REDIS_URL: ${REDIS_URL:-memory://}
      DOCUMENT_STORAGE: minio
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:?Configure el servidor MinIO}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:?Configure MINIO_ACCESS_KEY}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:?Configure MINIO_SECRET_KEY}
      MINIO_BUCKET_NAME: ${MINIO_BUCKET_NAME:-software-felipe}
      MINIO_SECURE: ${MINIO_SECURE:-true}
      FRONTEND_URL: ${FRONTEND_URL:?Configure el origen HTTPS del frontend}
      CORS_ORIGINS: ${CORS_ORIGINS:-${FRONTEND_URL}}
      COOKIE_SECURE: "true"
      TRUST_PROXY: "true"
      BOOTSTRAP_ON_START: "true"
      INIT_BUCKET_ON_START: ${INIT_BUCKET_ON_START:-false}
      DEMO_AUTH_ENABLED: ${DEMO_AUTH_ENABLED:-false}
      DEMO_ENVIRONMENT: ${DEMO_ENVIRONMENT:-false}
      DEMO_ACCESS_REQUIRED: ${DEMO_ACCESS_REQUIRED:-true}
      DEMO_ACCESS_CODE: ${DEMO_ACCESS_CODE:-}
      DEMO_SEED_ON_START: ${DEMO_SEED_ON_START:-false}
      AI_ENABLED: ${AI_ENABLED:-false}
      OLLAMA_BASE_URL: ${OLLAMA_BASE_URL:-https://ollama.com/v1}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-deepseek-v4.1-flash:cloud}
      OLLAMA_API_KEY: ${OLLAMA_API_KEY:-}
      AI_OUTPUT_MODE: ${AI_OUTPUT_MODE:-tool}
      GUNICORN_WORKERS: ${GUNICORN_WORKERS:-2}
      GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
    expose: ["5000"]
    restart: unless-stopped
    healthcheck:
      test: [CMD, curl, -f, http://localhost:5000/health]
      start_period: 120s
      interval: 10s
      timeout: 5s
      retries: 12
